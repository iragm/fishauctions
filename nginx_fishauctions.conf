    location / {

        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20M;

        # WebSocket connections (/ws/) are long-lived and mostly idle.  nginx's default
        # proxy_read_timeout is 60s, which would silently close an idle lot-page socket.
        # Keep them open for an hour.  (This also applies to plain HTTP here, which is fine
        # -- the app server has its own request timeouts.)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

    }
    location /static/ {

        include /etc/nginx/mime.types;

        types {
            application/gzip gz tar.gz;
        }

        default_type application/ocatet-stream;

        alias /home/app/web/staticfiles/;

        # Every page loads six of these and they were sent with no caching policy at all, so a
        # browser revalidated each one on every navigation. One hour, not longer: filenames here
        # are not content-hashed (Django's plain StaticFilesStorage), so a deploy that changes a
        # file has to wait out whatever we set. Raising this means switching to
        # ManifestStaticFilesStorage first -- see OPTIMIZATION.md.
        add_header Cache-Control "public, max-age=3600" always;

    }
    location /media/ {
        alias /home/app/web/mediafiles/;

        # Uploaded files are written once under a name Django makes unique, and are never edited in
        # place, so these can be cached properly.
        add_header Cache-Control "public, max-age=2592000" always;
    }
