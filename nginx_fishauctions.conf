    location / {

        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20M;

        # WebSocket connections (/ws/) are long-lived and mostly idle.  nginx's default
        # proxy_read_timeout is 60s, which would silently close an idle lot-page socket.
        # Keep them open for an hour.  (This also applies to plain HTTP here, which is fine
        # -- the app server has its own request timeouts.)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

    }
    # Content-hashed static files: css/auction_site.<12 hex>.css, written by
    # CacheBustedStaticFilesStorage and named by {% static %} on every page.  The name changes
    # whenever the bytes do, so the response can be cached forever -- editing auction_site.css and
    # deploying changes the URL, which is the whole point of hashing the name.
    #
    # This has to be its own block because a regex location cannot inherit the prefix alias below.
    # nginx tries regex locations before settling for a prefix match, so a hashed name lands here
    # and everything else in /static/ falls through to the next block.
    location ~ "^/static/(?<hashed_static_file>.+\.[0-9a-f]{12}\.[^./]+)$" {

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        alias /home/app/web/staticfiles/$hashed_static_file;

        # No `always` here, unlike every other add_header in this file: it would put a
        # one-year immutable header on the 404 too.  nginx starts in parallel with web, so
        # during a deploy there is a window where a browser can ask for a hashed name that
        # collectstatic has not written yet -- caching that 404 for a year would break the
        # page for that visitor permanently.  A bare nginx 404 carries no Last-Modified, so
        # with no Cache-Control it is not heuristically cached either.
        add_header Cache-Control "public, max-age=31536000, immutable";

    }
    location /static/ {

        include /etc/nginx/mime.types;

        types {
            application/gzip gz tar.gz;
        }

        default_type application/ocatet-stream;

        alias /home/app/web/staticfiles/;

        # Anything reached under its plain, un-hashed name: the copies collectstatic keeps
        # alongside the hashed ones, the handful of paths hard-coded as strings rather than
        # rendered through {% static %} (settings.py's summernote JS, /static/location_field), and
        # every name at all when DEBUG is on, since Django hashes nothing then.  One hour, because
        # a deploy that changes one of these cannot change its URL and has to wait the header out.
        add_header Cache-Control "public, max-age=3600" always;

    }
    location /media/ {
        alias /home/app/web/mediafiles/;

        # Uploaded files are written once under a name Django makes unique, and are never edited in
        # place, so these can be cached properly.
        add_header Cache-Control "public, max-age=2592000" always;
    }
