# Bounded container logs: the default json-file driver never rotates, so a chatty
# or crash-looping container can fill the host disk. Cap each container's logs at
# 3 x 10MB; every long-running service references this via *default-logging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared build config for the app image (web + celery). PUID/PGID must reach the Dockerfile's ARGs
# so the in-container app user matches the host owner of the bind-mounted mediafiles/logs dirs:
# update.sh chowns those to the same .env values, so an unwired ARG would let the two diverge
# whenever PUID/PGID is not 1000.
x-app-build: &app-build
  context: .
  args:
    PUID: ${PUID-1000}
    PGID: ${PGID-1000}

# web, celery_worker and celery_beat are one image built once and tagged by name, rather than
# three per-service images compose names after the project directory. CI pre-builds this tag with
# a layer cache and then never builds again (.github/workflows/test.yml); APP_IMAGE is how it says
# which tag it built.

# The fixed container names (django, db, redis, ...) are deliberate: the whole ops workflow --
# CLAUDE.md, update-packages.sh, cron, docs -- runs `docker exec django ...` against them. They do
# rule out `up --scale` and would collide between two checkouts on one host, but this is a
# single-instance deploy where greppable names win.
services:
  web:
    build: *app-build
    image: ${APP_IMAGE-fishauctions-app}
    container_name: django
    logging: *default-logging
    volumes:
      - .:/home/app/web
      # collectstatic output, in its own volume rather than bind-mounted onto the source tree. It
      # used to be ./auctions/static, which pointed STATIC_ROOT at the app's own static dir, so
      # collectstatic dumped third-party statics into git and update.sh needed a destructive
      # `git restore .`. The source dir is still visible through the repo mount above, which is
      # what AppDirectoriesFinder collects from.
      - staticfiles:/home/app/web/staticfiles
      - ./mediafiles:/home/app/web/mediafiles
      # Django's rotating log files (settings.py LOG_DIR) -- on the host so they
      # survive container recreation and can be grepped without docker exec.
      - ./logs:/home/logs
    expose:
      - 8000
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    # An HTTP check, because a TCP connect is not enough: the gunicorn master binds the socket
    # before forking, so TCP succeeds while every worker crash-loops on an import error. Any HTTP
    # response counts as alive (127.0.0.1 is in ALLOWED_HOSTS, and http.client never follows
    # redirects). start_period is generous: entrypoint.sh migrates and collects statics first.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python3 - <<'PY'
          import http.client
          conn = http.client.HTTPConnection("127.0.0.1", 8000, timeout=5)
          conn.request("GET", "/")
          conn.getresponse()
          PY
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  celery_worker:
    build: *app-build
    image: ${APP_IMAGE-fishauctions-app}
    container_name: celery_worker
    logging: *default-logging
    entrypoint: ["sh", "./celery_worker_entrypoint.sh"]
    volumes:
      - .:/home/app/web
      - ./logs:/home/logs
    env_file: .env
    environment:
      # Own log files (root-celery.log/django-celery.log): RotatingFileHandler is
      # not multiprocess-safe across services sharing the ./logs mount (settings.py).
      - LOG_SERVICE_NAME=celery
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build: *app-build
    image: ${APP_IMAGE-fishauctions-app}
    container_name: celery_beat
    logging: *default-logging
    entrypoint: ["sh", "./celery_beat_entrypoint.sh"]
    volumes:
      - .:/home/app/web
      - ./logs:/home/logs
    env_file: .env
    environment:
      - LOG_SERVICE_NAME=beat # own log files; see celery_worker
    depends_on:
      - db
      - redis
    restart: always

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    volumes:
      - .:/home/app/web
    entrypoint: [/bin/bash, /home/app/web/.github/scripts/test-and-lint.sh]
    env_file: .env
    profiles: [test]
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: db
    logging: *default-logging
    # A single release series rather than :latest, which jumps series on a routine pull and leaves
    # system tables behind unless mariadb-upgrade runs. 11.4 is LTS, maintained to 2029. Set
    # MARIADB_VERSION in .env if a data volume was created under a newer series -- MariaDB cannot
    # downgrade a data dir.
    image: mariadb:${MARIADB_VERSION-11.4}
    restart: always
    # Peak concurrency is not the process count: each of the 8 async gunicorn workers runs sync ORM
    # code in a threadpool, and with CONN_MAX_AGE=0 every in-flight request holds its own
    # connection, so an auction-end spike can hold a few hundred at once. 512 covers that and stays
    # bounded, which is what makes it a leak detector -- a leak shows as Max_used_connections
    # climbing toward the cap. (The old 10000 hid leaks and reserved huge per-thread memory.)
    command:
      - "--max_connections=512"       # bounded: covers peak fan-out AND surfaces leaks (watch Max_used_connections)
      - "--max_allowed_packet=16M"
      # wait_timeout is how long an IDLE connection is kept. Nothing here idles by accident -- HTTP
      # is fresh-per-request, Channels closes old connections around every dispatch, and celery's
      # Django fixup does the same at task boundaries -- so there is no unbounded-leak path, and
      # max_connections above is the backstop. A short timeout (3600s was tried) reaps
      # live-but-idle connections in long-task cases and surfaces as "server has gone away" 500s.
      # 30 days never reaps a live connection while staying finite, so a true zombie still clears.
      - "--wait_timeout=2592000"      # 30 days
      - "--interactive_timeout=3600"  # keep interactive/CLI sessions alive an hour for ops
      - "--open_files_limit=100000"   # legitimate: many tables x connections
      - "--net_read_timeout=120"      # finite (was 315M) so a stalled client frees its connection
      - "--net_write_timeout=180"     # finite (was 315M); headroom for slow large result streaming
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME-auctions}
      MYSQL_USER: ${DATABASE_USER-mysqluser}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD-unsecure}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD-unsecure}
      # Run mariadb-upgrade on startup after a server version change, so system
      # tables (mysql.proc etc.) never drift out of step with the running server.
      MARIADB_AUTO_UPGRADE: 1
    expose:
      - ${DATABASE_PORT-3306}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s # mariadb typically starts in under 60s; CI uses a separate 240s wait loop

  redis:
    container_name: redis
    logging: *default-logging
    # Pin a release series like the db (security patches within 7.4 flow on rebuild,
    # no surprise major jumps). Redis is the Celery broker + result backend + cache
    # + channels pub/sub layer.
    image: redis:${REDIS_VERSION-7.4}
    expose:
      - 6379
    volumes:
      # The official redis image persists to /data; the old /bitnami/redis/data mount was a
      # leftover, so the volume was never written and the broker queue was wiped on every recreate.
      # AOF (appendfsync everysec) keeps the queue across restarts, losing at most a second.
      - redis_data:/data
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD-unsecure}
      --appendonly yes
      --appendfsync everysec

  nginx:
    container_name: nginx
    logging: *default-logging
    # A pinned tag rather than :latest, so a routine pull can't drag in a swag/nginx release that
    # reorganizes its config includes and breaks the site. NGINX_IMAGE selects dev (nginx) or prod
    # (swag) and NGINX_TAG pins the version; both tags still get rebuilds on `docker compose pull`,
    # so patches flow without major jumps. The 1.27 default only exists for the dev image -- with
    # swag, NGINX_TAG MUST be set in .env, and update.sh refuses to deploy otherwise.
    image: ${NGINX_IMAGE-nginx}:${NGINX_TAG-1.27}
    volumes:
      # the root conf file is set for dev, but for production use:
      # NGINX_CONF='./nginx.prod.conf'
      # NGINX_CONF_LOCATION='/config/nginx/site-confs/default.conf'
      # nginx.prod.conf is gitignored and rendered by update.sh. If compose runs before it exists,
      # Docker creates the mount source as a DIRECTORY and swag silently serves its own default
      # config -- always deploy via ./update.sh, which renders it and self-heals that case.
      - ${NGINX_CONF-./nginx.dev.conf}:${NGINX_CONF_LOCATION-/etc/nginx/nginx.conf}
      - ./swag:/config
      - ./nginx_fishauctions.conf:/etc/nginx/nginx_fishauctions.conf:ro
      # Serve the collected statics from the shared volume that web writes to
      # (was a bind mount onto the source tree; see the web service for why).
      - staticfiles:/home/app/web/staticfiles:ro
      - ./mediafiles:/home/app/web/mediafiles:ro
    ports:
      - ${HTTP_PORT-80}:80
      - ${SSL_PORT-443}:443 # this is only used in production
    restart: always
    # Deliberately NOT service_healthy: gating nginx on web's health removes the graceful path. If
    # web can't become healthy -- a failed migration crash-looping it -- nginx could never start or
    # be recreated, so the public endpoint would be connection-refused and cert renewal would stop,
    # instead of nginx serving 502s until web recovers. It tolerates an absent upstream fine, so it
    # only needs start ordering; web's healthcheck still reports in `ps` and `--wait`.
    depends_on:
      web:
        condition: service_started
    # NET_ADMIN is for the prod swag image only: its bundled fail2ban edits iptables to ban abusive
    # IPs. The dev nginx image never uses it -- inert there, a minor over-grant on a local
    # container -- and compose can't drop a single cap_add entry by env, so it stays for both. The
    # prod config path (nginx.prod.conf plus swag's ssl.conf includes) has no dev harness at all,
    # so change nginx.prod.conf and nginx_fishauctions.conf carefully.
    cap_add:
      - NET_ADMIN
    environment: # none of these get used in development
      - PUID=${PUID-1000}
      - PGID=${PGID-1000}
      - TZ=Etc/UTC
      - URL=${SITE_DOMAIN}
      - VALIDATION=http
      - EMAIL=${ADMIN_EMAIL}
      # The ACME CA swag requests certs from; empty is swag's default, Let's Encrypt. Prod runs
      # zerossl since the 2026-07-20 incident, when swag's init revoked every LE cert for the
      # domain and reissue was rate-limited for a week. Lives in .env, so update.sh's
      # `git restore .` can't strip it on deploy.
      - CERTPROVIDER=${CERTPROVIDER-}

  selenium:
    container_name: selenium
    logging: *default-logging
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    expose:
      - 4444
    profiles: [selenium]
    environment:
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_SESSION_TIMEOUT=300
    healthcheck:
      test: ["CMD-SHELL", "curl -sSL http://localhost:4444/status | grep -qE '\"ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  redis_data:
  mariadb_data:
  # collectstatic output (STATIC_ROOT). A named volume rather than a bind mount onto
  # ./auctions/static, so collected third-party statics never land in git. Repopulated on start.
  staticfiles:
