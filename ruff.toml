line-length = 120

[lint]
ignore = [
    "E501",
    "E722",
    "PT009",
    "PT027",
]
# `select`, not `extend-select`. Ruff 0.16.0 changed what its *default* selection is, so
# `extend-select` -- which adds to that default -- silently pulled in RUF, PL, SIM, TRY and the
# rest and reported ~1470 findings across the repo the first time an image was rebuilt with a
# current ruff. `select` states the whole rule set outright and means the same thing on every ruff
# version. Nothing is lost by the change: `E` and `F` are in the list below, and they are what the
# old default was.
select = [
    "A",    # flake8-builtins
    # "ARG",  # flake8-unused-arguments
    # "B",    # flake8-bugbear
    "C4",    # flake8-comprehensions
    # "C90",  # McCabe Complexity
    # "D",    # pydocstyle
    # "DJ",   # flake8-django
    "E",    # pycodestyle
    "EM",   # flake8-errmsg
    # "ERA",  # eradicate
    "DTZ",  # flake8-datetimez
    "F",    # pyflakes
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    # "N",    # pep8-naming
    # "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    # "RET",  # flake8-return
    # "RUF",  # ruff-specific rules
    # "S",    # flake8-bandit
    # "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[format]
# Ruff 0.16 started formatting Python code blocks inside Markdown, which quietly rewrites the
# examples in SES.md, AR.md and CLAUDE.md to this file's 120-column line length. Documentation
# was never in the formatter's scope here and a version bump is not the moment to put it there,
# so it stays out. Linting is unaffected -- ruff never linted Markdown.
exclude = ["*.md"]
