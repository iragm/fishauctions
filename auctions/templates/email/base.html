{% load email_tags %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% comment %}Light only: every color below is inline, so a client that honored "dark" would leave dark text on its dark background.{% endcomment %}
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<style>
  a { color: #375a7f; }
  img { max-width: 100%; height: auto; }
  h3 { font-size: 18px; margin: 24px 0 8px; }
  ol, ul { padding-left: 24px; }
  li { margin-bottom: 6px; }
</style>
</head>
<body style="margin:0;padding:0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="padding:24px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr><td>{% block header %}{% endblock %}</td></tr>
        <tr>
          <td style="text-align:left;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#222222;">
{% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">{% block footer %}{% email_footer %}{% endblock %}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
