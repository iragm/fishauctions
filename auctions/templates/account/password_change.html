{% extends "base.html" %}

{% load i18n %}
{% load crispy_forms_tags %}
{% block title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
<div class="mt-3">
  <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
    {% csrf_token %}
    {{ form | crispy }}
    <button class="btn btn-success text-dark" type="submit" name="action">Save</button>
  </form>
</div>
{% endblock %}
