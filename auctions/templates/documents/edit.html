{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit {{ document.display_title }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">{{ document.display_title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{% url 'document_detail' document.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
