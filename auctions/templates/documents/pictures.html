{% extends "base.html" %}
{% block title %}Pictures for {{ document.display_title }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">Pictures for <a href="{{ document.get_absolute_url }}">{{ document.display_title }}</a></h1>
  <form method="post" enctype="multipart/form-data" class="mb-4">
    <input type="hidden" name="from_page" value="1">
    <input class="form-control mb-2" type="file" name="file" accept="image/*" multiple required>
    <button type="submit" class="btn btn-primary">Add</button>
  </form>
  <div class="row g-3">
    {% for picture in pictures %}
      <div class="col-6 col-md-3">
        <img class="img-fluid rounded mb-1" src="{% url 'document_picture' picture.pk %}" alt="{{ picture.caption|default:'Picture' }}">
        {% if picture.caption %}<div class="small">{{ picture.caption }}</div>{% endif %}
        <form method="post">
          <input type="hidden" name="from_page" value="1">
          <button type="submit" name="remove" value="{{ picture.pk }}" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i> Remove</button>
        </form>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
