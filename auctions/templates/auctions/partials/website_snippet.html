{% comment %}
One "put this on your website" block, rendered from a dict built by ClubWebsiteIntegrationView.
Expects `snippet` with: title, icon, blurb, url, available, unavailable_reason, settings_url, and
counts/default_count/max_count for the ones that take a ?count=.

The snippet is one `<script src>` and nothing else: ?format=js answers with a few lines that write
the unstyled rows into the page right where the tag sits, so they wrap and grow like the rest of the
club's page and pick up its fonts. It replaced an iframe plus an inline height listener, which
WordPress broke: its editor rewrites `&&` inside a pasted script to `&#038;&#038;`, the listener
died on a SyntaxError, and every frame stayed stuck at a guessed height. A tag with no code inside
it has nothing for a CMS to rewrite. The iframe formats are still served for snippets pasted before.

A snippet carrying `links` instead is the other kind: plain addresses rather than an embed, for
the things a club's own site already knows how to present (a "subscribe" button in their menu).
It shares this card so the heading, the blurb and the switched-off note read the same either way.

Everything is spelled out rather than generated by JavaScript, because the thing being handed over
is text somebody copies into WordPress: a "copy" button that fails silently on an old browser
leaves them with nothing, where a visible <pre> always works.

Only ever use {% templatetag openblock %} comment {% templatetag closeblock %} blocks in here.
Django's {% templatetag openbrace %}# … #{% templatetag closebrace %} form is single-line only;
spread one over two lines and it renders straight onto the page.
{% endcomment %}
<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title mb-1"><i class="bi {{ snippet.icon }}"></i> {{ snippet.title }}</h5>
    <p class="small text-muted mb-2">{{ snippet.blurb }}</p>

    {% if not snippet.available %}
    {% comment %}Deliberately still listed, snippet and all: somebody deciding what to put on the
    club's website is exactly the person who should find out that a feature they have switched off
    would give them something worth showing.{% endcomment %}
    <div class="help-note"><i class="bi bi-lightbulb-fill"></i><div>
      {{ snippet.unavailable_reason }}
      {% if snippet.links %}The addresses below are still the right ones &mdash; they start working
      again as soon as you turn it back on.{% else %}The snippet below is still correct &mdash; it
      will start showing something as soon as you turn it on.{% endif %}
      {% if snippet.settings_url %}<a href="{{ snippet.settings_url }}">Change that here.</a>{% endif %}
    </div></div>
    {% endif %}

    {% if snippet.links %}
    {% for link in snippet.links %}
    <label class="form-label small fw-bold mb-1">{{ link.label }}</label>
    <div class="small mb-1"><code>{{ link.url }}</code></div>
    <p class="small text-muted mb-3">{{ link.note }}</p>
    {% endfor %}
    {% else %}
    <label class="form-label small fw-bold mb-1">Paste this where it should appear</label>
    <pre class="small border rounded p-2 mb-2" style="white-space:pre-wrap;word-break:break-all;">&lt;script src="{{ snippet.url }}?format=js{% if snippet.counts %}&amp;count={{ snippet.default_count }}{% endif %}"&gt;&lt;/script&gt;</pre>
    <p class="small text-muted mb-2">
      It shows up in your site's own fonts and colours.{% if snippet.counts %} Any <code>count</code>
      from 1 to {{ snippet.max_count }} works.{% endif %}
    </p>

    <label class="form-label small fw-bold mb-1">Unstyled &mdash; style it yourself</label>
    <div class="small mb-2"><code>{{ snippet.url }}?format=unstyledhtml{% if snippet.counts %}&amp;count={{ snippet.default_count }}{% endif %}</code></div>
    <label class="form-label small fw-bold mb-1">JSON &mdash; for developers</label>
    <div class="small mb-0"><code>{{ snippet.url }}?format=json{% if snippet.counts %}&amp;count={{ snippet.default_count }}{% endif %}</code></div>
    {% endif %}
  </div>
</div>
