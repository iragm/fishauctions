# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^(auctions/static/(js/vendor|css/vendor|admin|autocomplete_light|bootstrap_datepicker_plus|django_extensions|django_htmx|django_tables2|el-pagination|summernote|location_field|markdownfield|webpush)/|auctions/mcp/vendor/)
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version. Keep in sync with `ruff` in requirements-test.txt.
  rev: v0.16.2
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    # Django only matches a template tag within a single line, so one spread over two renders
    # onto the page as text with no error anywhere. Ruff can't see inside templates; this is the
    # same checker auctions.test_template_hygiene runs, so the two can't disagree.
    - id: django-template-tags
      name: Django template tags render as tags, not text
      entry: python3 auctions/template_lint.py
      language: system
      pass_filenames: false
      files: templates/.*\.(html|txt)$
    # docs/module_map.md is generated from every module's docstring and top-level names. Checked
    # in so it can be read without running anything, which means it can also be stale; this is the
    # check that it isn't. It also enforces "a module over 300 lines says what it is for" and the
    # file-size ratchet. Same checker auctions.test_module_map runs.
    - id: module-map
      name: docs/module_map.md matches the modules it describes
      entry: python3 auctions/module_map.py
      language: system
      pass_filenames: false
      files: \.py$|^docs/module_map\.md$
